name: direct-push-guard

# Tripwire: alerts if someone pushes directly to a protected branch (bypassing PR review).
# Detection uses the commits->pulls API, so it correctly recognizes merge, squash, AND
# rebase merges (all associate the resulting commit with a merged PR).
on:
  push:
    branches: [develop, staging, main]

permissions:
  contents: read

env:
  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

jobs:
  guard:
    runs-on: [self-hosted, rcp-frontend]
    steps:
      - name: Verify push came from a merged PR
        run: |
          # Count merged PRs associated with this commit (no jq/gh dependency).
          MERGED=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | grep -oE '"merged_at": *"[0-9]' | wc -l)

          if [ "${MERGED:-0}" -gt 0 ]; then
            echo "✅ Push to ${{ github.ref_name }} is from a merged PR."
            exit 0
          fi

          MSG="⚠️ Direct push to ${{ github.ref_name }} by ${{ github.actor }} (no associated merged PR)"
          echo "$MSG"
          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            curl -s -H 'Content-Type: application/json' \
              -d "{\"text\":\"$MSG\"}" "$TEAMS_WEBHOOK_URL"
          fi
          exit 1
