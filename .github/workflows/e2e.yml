name: e2e

# Playwright end-to-end tests. Nightly + on-demand (kept off the PR gate for speed).
# Runs against the app in mock mode until a backend exists.
on:
  schedule:
    - cron: "30 2 * * *" # nightly 02:30 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional base URL to test against (defaults to a local build)
        required: false
        default: ""

permissions:
  contents: read

env:
  NEXT_PUBLIC_USE_MOCK: "true"
  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

jobs:
  e2e:
    runs-on: [self-hosted, rcp-frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Playwright browsers (pre-installed on runner; no-op safety net)
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e -- --workers=4
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify Teams on failure
        if: failure() && env.TEAMS_WEBHOOK_URL != ''
        run: |
          curl -s -H 'Content-Type: application/json' \
            -d "{\"text\":\"🎭 Frontend e2e (Playwright) failed on ${{ github.ref_name }}\"}" \
            "$TEAMS_WEBHOOK_URL"
