name: security

# Parallel, mostly non-blocking security track. Runs on PRs and nightly.
# Secret scan + container/filesystem scan block on CRITICAL once the baseline is clean;
# dependency audit is report-only.
on:
  pull_request:
    branches: [develop, staging, main]
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

jobs:
  scan:
    runs-on: [self-hosted, rcp-frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks needs full history

      # The gitleaks-action wrapper requires a paid license for org repos, but the
      # gitleaks binary is free — run it via its Docker image instead.
      - name: Secret scan (Gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 detect \
            --source=/repo --redact --no-banner --verbose

      - name: Dependency audit (report only)
        run: |
          echo "## npm audit (high+)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      # Run Trivy via its Docker image rather than trivy-action: the action's
      # pinned setup-trivy transitive dependency has broken tags. The image is
      # self-contained and version-pinned; the named volume persists the vuln DB.
      - name: Trivy filesystem/dependency scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.71.2 fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --no-progress \
            --exit-code 0 \
            /repo

      - name: Notify Teams on failure
        if: failure() && env.TEAMS_WEBHOOK_URL != ''
        run: |
          curl -s -H 'Content-Type: application/json' \
            -d "{\"text\":\"🔒 Frontend security scan failed on ${{ github.ref_name }}\"}" \
            "$TEAMS_WEBHOOK_URL"
