name: security

# Parallel security track on PRs + nightly. Each scanner is its own job so they
# run concurrently (matches the lead-generator / bench-sales house style).
#
# Scanners run via pinned Docker images on purpose:
#   - the gitleaks-action wrapper needs a paid license for org repos (the binary is free)
#   - trivy-action's pinned setup-trivy transitive dependency has broken tags
# The images are self-contained and version-pinned; a named volume persists Trivy's DB.
on:
  pull_request:
    branches: [develop, staging, main]
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: [self-hosted, rcp-frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks needs full history

      - name: Secret scan (Gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 detect \
            --source=/repo --redact --no-banner --verbose

  audit:
    name: Audit
    runs-on: [self-hosted, rcp-frontend]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm audit reads package-lock.json only — no npm ci needed. Report-only.
      - name: Dependency audit (report only)
        run: |
          echo "## npm audit (high+)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  trivy:
    name: Trivy
    runs-on: [self-hosted, rcp-frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # exit-code 0 = report-only for now. Flip to --exit-code 1 (and split a
      # CRITICAL-only blocking pass) once the baseline is clean — see the other repos.
      - name: Trivy filesystem/dependency scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.71.2 fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --no-progress \
            --exit-code 0 \
            /repo

  notify:
    name: Notify on failure
    needs: [secret-scan, audit, trivy]
    if: failure()
    runs-on: [self-hosted, rcp-frontend]
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
    steps:
      - name: Notify Teams
        if: env.TEAMS_WEBHOOK_URL != ''
        run: |
          curl -s -H 'Content-Type: application/json' \
            -d "{\"text\":\"🔒 Frontend security scan failed on ${{ github.ref_name }}\"}" \
            "$TEAMS_WEBHOOK_URL"
