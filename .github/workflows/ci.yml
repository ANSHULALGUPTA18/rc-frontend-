name: ci

# Full quality gate on every PR. BLOCKS MERGE.
# Runs in mock mode, so no backend or Azure is required.
on:
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_USE_MOCK: "true" # mock mode: no backend needed in CI
  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

jobs:
  ci:
    # Single self-hosted frontend runner. No runner yet? Use: runs-on: ubuntu-latest
    runs-on: [self-hosted, rcp-frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify Teams on failure
        if: failure() && env.TEAMS_WEBHOOK_URL != ''
        run: |
          curl -s -H 'Content-Type: application/json' \
            -d "{\"text\":\"❌ Frontend CI failed on PR #${{ github.event.pull_request.number }} (${{ github.head_ref }})\"}" \
            "$TEAMS_WEBHOOK_URL"
